name: Deploy LenxiQ LiveKit Voice Agent

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'Dockerfile'
      - 'tsconfig.json'
      - '!livekit.toml'
      - '.github/workflows/livekit-deploy.yml'
  workflow_dispatch:
    inputs:
      operation:
        description: 'LiveKit Cloud operation'
        required: true
        type: choice
        options:
          - create
          - deploy
          - status-retry
        default: create
      region:
        description: 'Optional LiveKit Cloud deployment region'
        required: false
        type: string
        default: ''

concurrency:
  group: livekit-voice-agent-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-on-push:
    name: Deploy changed agent
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check for generated LiveKit configuration
        id: agent-config
        shell: bash
        run: |
          if [ -f livekit.toml ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy LiveKit Cloud agent
        if: ${{ steps.agent-config.outputs.exists == 'true' }}
        uses: livekit/deploy-action@v2
        env:
          LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
          SECRET_LIST: DEEPGRAM_API_KEY=${{ secrets.DEEPGRAM_API_KEY }},CARTESIA_API_KEY=${{ secrets.CARTESIA_API_KEY }}
        with:
          OPERATION: deploy
          WORKING_DIRECTORY: .
          REGION: ${{ secrets.LIVEKIT_AGENT_REGION }}

  manual-create-or-deploy:
    name: Create or deploy agent manually
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.operation == 'create' || inputs.operation == 'deploy') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create or deploy LiveKit Cloud agent
        uses: livekit/deploy-action@v2
        env:
          LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
          SECRET_LIST: DEEPGRAM_API_KEY=${{ secrets.DEEPGRAM_API_KEY }},CARTESIA_API_KEY=${{ secrets.CARTESIA_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          OPERATION: ${{ inputs.operation }}
          WORKING_DIRECTORY: .
          REGION: ${{ inputs.region }}

      - name: Open pull request for generated LiveKit configuration
        if: ${{ inputs.operation == 'create' }}
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          add-paths: livekit.toml
          branch: livekit-agent-config-${{ github.run_id }}
          title: Add LiveKit agent configuration
          commit-message: Add LiveKit agent configuration
          body: |
            This pull request adds the LiveKit Cloud agent configuration generated by the create operation.
          base: main
          delete-branch: true

  manual-status:
    name: Verify agent reaches running state
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'status-retry' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Wait for LiveKit Cloud agent
        uses: livekit/deploy-action@v2
        env:
          LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
        with:
          OPERATION: status-retry
          WORKING_DIRECTORY: .
          TIMEOUT: 5m
