name: Repair LenxiQ medical question bank
on:
  push:
    branches: [main]
    paths:
      - 'scripts/repair_question_bank.py'
      - 'scripts/test_repair_question_bank.py'
      - 'scripts/export_medical_review.py'
      - 'scripts/repair_reviewed_medical_items.py'
      - '.github/workflows/correct-question-bank.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: lenxiq-medical-question-content-edit
  cancel-in-progress: false

jobs:
  repair:
    name: Audit, correct, and verify medical records
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    env:
      LENXIQ_PROJECT_REF: hixvbcrrklyajhkyliay
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Checkout question-bank repair rules
        uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test text repairs and clinical rules before any database edits
        run: python -m unittest discover -s scripts -p 'test_repair_question_bank.py' -v
      - name: Verify intended Supabase credentials
        shell: bash
        run: |
          if [[ -z "$SUPABASE_ACCESS_TOKEN" ]]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is not available in the production environment."
            exit 1
          fi
      - name: Apply reversible repairs directly to Supabase
        run: python scripts/repair_question_bank.py
      - name: Correct and verify reviewed medical answers and classifications
        run: python scripts/repair_reviewed_medical_items.py
      - name: Collect medical question review data (no account records)
        run: python scripts/export_medical_review.py
      - name: Save review securely for one day
        uses: actions/upload-artifact@v4
        with:
          name: lenxiq-medical-questions-review
          path: ${{ runner.temp }}/lenxiq-medical-review.json
          if-no-files-found: error
          retention-days: 1
      - name: Mark the verified database repair on its GitHub commit
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA"             -f state=success -f context=lenxiq/question-bank-repair             -f description="Medical question-bank corrections executed and verified"             -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - name: Mark database repair failure on its GitHub commit
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA"             -f state=failure -f context=lenxiq/question-bank-repair             -f description="Database corrections incomplete; inspect workflow log"             -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
