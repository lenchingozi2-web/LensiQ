name: Install additive Live Class concept models

on:
  push:
    branches: [main]
    paths:
      - 'scripts/generate_live_class_concept_pack.py'
      - '.github/workflows/install-live-class-concepts.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: lenxiq-live-class-concept-install
  cancel-in-progress: false

jobs:
  install:
    name: Validate and upload 19 small, original 3D models
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TARGET_PROJECT: https://hixvbcrrklyajhkyliay.supabase.co
      TARGET_BUCKET: medical-models
      ASSET_DIR: ${{ runner.temp }}/lenxiq-concept-pack
    steps:
      - name: Checkout isolated pack generator
        uses: actions/checkout@v4
      - name: Confirm correct project, never alter another database
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SUPABASE_URL" == "$TARGET_PROJECT" ]] || { echo "::error::Medical project mismatch"; exit 1; }
          [[ -n "$SUPABASE_SERVICE_ROLE_KEY" ]] || { echo "::error::No private storage credential"; exit 1; }
      - name: Generate compact new medical teaching models (no existing assets modified)
        run: python3 scripts/generate_live_class_concept_pack.py --output-dir "$ASSET_DIR"
      - name: Validate all mesh names, GLB headers and manifest checksums
        shell: bash
        run: |
          python3 - <<'PY'
          import os, pathlib, json, struct, hashlib
          root=pathlib.Path(os.environ["ASSET_DIR"])
          manifest=json.loads((root/"manifest-concepts-v1.json").read_text())
          files=manifest["assets"]
          assert len(files)==19, f"Expected exactly 19 models; found {len(files)}"
          total=0
          for asset in files:
              p=root/asset["path"]
              data=p.read_bytes()
              assert data[:4]==b"glTF" and len(data)==struct.unpack_from("<I",data,8)[0], p
              assert len(data)<600_000, f"Too large: {p}"
              assert hashlib.sha256(data).hexdigest()==asset["sha256"], p
              n=struct.unpack_from("<I",data,12)[0]
              doc=json.loads(data[20:20+n])
              assert doc["asset"]["version"]=="2.0"
              assert len(doc["meshes"])>=3
              assert all(node.get("name") and "mesh" in node for node in doc["nodes"])
              assert all(mesh.get("primitives") for mesh in doc["meshes"])
              assert all(accessor["count"]>0 for accessor in doc["accessors"])
              total+=len(data)
          assert total<=8_000_000, f"Model pack exceeds 8MB limit: {total}"
          print(f"Validated {len(files)} named, selectable GLBs; total {total:,} bytes.")
          PY
      - name: Check storage free space without deleting or overwriting objects
        shell: bash
        run: |
          python3 scripts/supabase_storage_preflight.py \
            --asset-dir "$ASSET_DIR" \
            --target-bucket "$TARGET_BUCKET" \
            --project-cap-bytes 650000000 \
            --max-file-bytes 600000
      - name: Upload only brand-new, immutable versioned model paths
        shell: bash
        run: |
          python3 - <<'PY'
          import os, json, hashlib, pathlib, urllib.request, urllib.error, urllib.parse
          root=pathlib.Path(os.environ["ASSET_DIR"])
          base=os.environ["SUPABASE_URL"].rstrip("/")
          key=os.environ["SUPABASE_SERVICE_ROLE_KEY"]
          bucket=os.environ["TARGET_BUCKET"]
          assets=json.loads((root/"manifest-concepts-v1.json").read_text())["assets"]
          for asset in assets:
              rel="concepts-v1/"+asset["path"]
              path=root/asset["path"]
              data=path.read_bytes()
              url=f"{base}/storage/v1/object/{bucket}/{urllib.parse.quote(rel,safe='/')}"
              public=f"{base}/storage/v1/object/public/{bucket}/{urllib.parse.quote(rel,safe='/')}"
              # Previously uploaded identical objects are okay; conflicting objects cannot be replaced.
              try:
                  with urllib.request.urlopen(urllib.request.Request(public,method="GET"),timeout=15) as f:
                      existing=f.read(600001)
                  if hashlib.sha256(existing).hexdigest()!=asset["sha256"]:
                      raise RuntimeError("An existing path has different content; refuse to overwrite: "+rel)
                  print("Already verified identical asset:",rel)
                  continue
              except urllib.error.HTTPError as e:
                  if e.code!=404:raise
              request=urllib.request.Request(
                  url,data=data,method="POST",
                  headers={"Authorization":"Bearer "+key,"apikey":key,
                           "Content-Type":"model/gltf-binary","Cache-Control":"public, max-age=31536000, immutable",
                           "x-upsert":"false"})
              with urllib.request.urlopen(request,timeout=45) as response:
                  if response.status not in (200,201):raise RuntimeError("Upload unsuccessful")
              with urllib.request.urlopen(urllib.request.Request(public,method="GET"),timeout=20) as f:
                  remote=f.read(600001)
              if hashlib.sha256(remote).hexdigest()!=asset["sha256"]:
                  raise RuntimeError("Uploaded model failed content verification: "+rel)
              print(f"Verified uploaded model: {rel} ({len(data):,} bytes)")
          print(f"Successfully verified {len(assets)} versioned concept model objects. Original models and all other buckets left untouched.")
          PY
      - name: Mark verified model upload
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=success -f context=lenxiq/medical-model-upload \
            -f description="19 original 3D concept models uploaded and readback verified" \
            -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - name: Report failed upload without touching existing content
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=failure -f context=lenxiq/medical-model-upload \
            -f description="Model installation incomplete; preexisting storage not changed" \
            -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
