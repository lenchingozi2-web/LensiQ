name: Study Hub runtime checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies for document parsing and UI checks
        run: npm ci --ignore-scripts
      - name: Verify Study Hub regression tests
        run: node --test tests/*.test.mjs
      - name: Check LiveKit worker Python syntax
        run: python3 -m py_compile worker/lensiq-voice-tutor/agent.py
      - name: Check pinned worker imports
        run: |
          python3 -m venv "$RUNNER_TEMP/lensiq-worker"
          "$RUNNER_TEMP/lensiq-worker/bin/pip" install --disable-pip-version-check -r worker/lensiq-voice-tutor/requirements.txt
          cd worker/lensiq-voice-tutor
          "$RUNNER_TEMP/lensiq-worker/bin/python" -c "import agent, inspect; from livekit.agents import AgentSession; assert agent.server is not None; assert 'skip_reply' in inspect.signature(AgentSession.commit_user_turn).parameters"
          "$RUNNER_TEMP/lensiq-worker/bin/python" -m unittest test_agent -v
      - name: TypeScript
        run: npx tsc --noEmit
      - name: ESLint
        run: npm run lint
      - name: Production build
        run: npm run build
