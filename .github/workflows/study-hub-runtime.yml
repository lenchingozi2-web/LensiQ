name: Study Hub runtime checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies for document parsing and UI checks
        run: npm ci --ignore-scripts
      - name: Verify Study Hub regression tests
        run: node --test tests/*.test.mjs
      - name: Check LiveKit worker Python syntax
        run: python3 -m py_compile worker/lensiq-voice-tutor/agent.py
      - name: TypeScript
        run: npx tsc --noEmit
      - name: ESLint
        run: npm run lint
      - name: Production build
        run: npm run build
