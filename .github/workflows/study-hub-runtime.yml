name: Study Hub runtime checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify Study Hub regression tests
        run: node --test tests/study-hub-runtime.test.mjs
      - name: Check voice worker syntax
        run: python -m py_compile pipecat-voice-agent/agent.py pipecat-voice-agent/agent_modal.py pipecat-voice-agent/visual_tutor.py
      - name: Verify voice interaction and visual routing unit tests
        run: python -m unittest discover -s pipecat-voice-agent -p 'test_visual_tutor.py' -v
