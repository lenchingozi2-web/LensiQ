name: Verify LenxiQ medical Supabase access

on:
  workflow_dispatch:
    inputs:
      check:
        description: 'Read-only verification to run'
        required: true
        type: choice
        options:
          - project-access
          - migration-history
        default: project-access

permissions:
  contents: read

concurrency:
  group: lenxiq-medical-supabase-verification
  cancel-in-progress: false

jobs:
  verify:
    name: Verify medical Supabase (read-only)
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    env:
      PROJECT_REF: hixvbcrrklyajhkyliay
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Ensure a Supabase access token exists
        shell: bash
        run: |
          if [[ -z "${SUPABASE_ACCESS_TOKEN}" ]]; then
            echo "::error::Add SUPABASE_ACCESS_TOKEN to GitHub Actions secrets (repository or production environment)."
            exit 1
          fi

      - uses: supabase/setup-cli@v3
        with:
          version: 2.84.2

      - name: Confirm connection points to the medical Supabase project
        shell: bash
        run: |
          set -euo pipefail
          supabase projects list --output json > "$RUNNER_TEMP/lenxiq-projects.json"
          if ! jq --exit-status --arg ref "$PROJECT_REF" '
            if type == "array" then
              any(.[]; .id == $ref or .ref == $ref)
            else
              any(.projects[]?; .id == $ref or .ref == $ref)
            end
          ' "$RUNNER_TEMP/lenxiq-projects.json" >/dev/null; then
            echo "::error::This Supabase token cannot access the intended LenxiQ medical project ($PROJECT_REF). Check the Supabase organization/account before proceeding."
            exit 1
          fi
          echo "Supabase access confirmed for the correct LenxiQ medical project."
          echo "This job does not write to the database."

      - name: Compare local and remote migration history (read-only)
        if: ${{ inputs.check == 'migration-history' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${SUPABASE_DB_PASSWORD}" ]]; then
            echo "::error::Add SUPABASE_DB_PASSWORD as a GitHub Actions secret to inspect migration history."
            exit 1
          fi
          # The existing repository has no tracked supabase/config.toml.
          # Initialize only in this throwaway runner; no generated files are committed.
          if [[ ! -f supabase/config.toml ]]; then supabase init --yes; fi
          supabase link --project-ref "$PROJECT_REF"
          supabase migration list --linked
          echo "Inspection complete. Review differences before allowing any database migration."

      - name: Summarize safeguards
        if: always()
        run: |
          echo "### LenxiQ medical Supabase verification" >> "$GITHUB_STEP_SUMMARY"
          echo "- Intended project ref: \`$PROJECT_REF\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Requested check: \`${{ inputs.check }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Database writes: **disabled**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Before future db push: baseline existing migrations and remove version collisions." >> "$GITHUB_STEP_SUMMARY"
