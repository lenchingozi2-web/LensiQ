name: HRA source size & selection preflight
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/plan-hra-pack.yml'
      - 'scripts/plan_hra_pack.py'
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --disable-pip-version-check "PyYAML==6.0.2"
      - run: python3 scripts/plan_hra_pack.py
      - uses: actions/upload-artifact@v4
        with:
          name: lenxiq-hra-source-size-preflight
          path: hra-model-preflight.json
          retention-days: 3
      - if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state=success -f context=lenxiq/hra-size-preflight -f description="HRA source file sizes and safe pack selection confirmed" -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state=failure -f context=lenxiq/hra-size-preflight -f description="Source size preflight failed; no storage modifications" -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
