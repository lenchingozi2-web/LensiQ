name: Deploy LenxiQ Modal voice worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'pipecat-voice-agent/**'
      - '.github/workflows/deploy-modal.yml'

permissions:
  contents: read
  statuses: write

concurrency:
  group: lenxiq-modal-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Pipecat worker to Modal
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - name: Checkout LenxiQ medical study hub
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate Modal credentials
        shell: bash
        run: |
          if [[ -z "$MODAL_TOKEN_ID" || -z "$MODAL_TOKEN_SECRET" ]]; then
            echo "::error::Missing MODAL_TOKEN_ID or MODAL_TOKEN_SECRET. Store both as GitHub Actions repository secrets or production environment secrets."
            exit 1
          fi

      - name: Check Python worker syntax
        run: python -m py_compile pipecat-voice-agent/agent.py pipecat-voice-agent/agent_modal.py

      - name: Test clinical visual selection, model safety and numerical interaction
        run: python -m unittest discover -s pipecat-voice-agent -p 'test_visual_tutor.py' -v

      - name: Install Modal CLI
        run: python -m pip install 'modal>=1.0,<2'

      - name: Deploy LenxiQ worker
        run: modal deploy pipecat-voice-agent/agent_modal.py

      - name: Publish verified Modal worker deployment result
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=success -f context=lenxiq/modal-voice-deployment \
            -f description="Pipecat voice worker and visual interaction tests deployed to Modal" \
            -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - name: Mark blocked Modal deployment
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=failure -f context=lenxiq/modal-voice-deployment \
            -f description="Modal voice worker deployment failed; prior worker remains in service" \
            -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
