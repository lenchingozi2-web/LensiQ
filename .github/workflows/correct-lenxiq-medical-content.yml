name: Correct LenxiQ medical question bank

on:
  push:
    branches: [main]
    paths:
      - 'supabase/sql/20261101_medical_content_precision_repairs.sql'
      - '.github/workflows/correct-lenxiq-medical-content.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lenxiq-medical-question-corrections
  cancel-in-progress: false

jobs:
  correct:
    name: Correct MCQ, theory and practical text
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    env:
      PROJECT_REF: hixvbcrrklyajhkyliay
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SQL_FILE: supabase/sql/20261101_medical_content_precision_repairs.sql
    steps:
      - uses: actions/checkout@v4

      - name: Validate project access and reviewed correction file
        shell: bash
        run: |
          set -euo pipefail
          test -s "$SQL_FILE"
          if [[ -z "$SUPABASE_ACCESS_TOKEN" ]]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is unavailable to the production GitHub environment."
            exit 1
          fi
          if [[ "$PROJECT_REF" != "hixvbcrrklyajhkyliay" ]]; then
            echo "::error::Wrong medical project reference."
            exit 1
          fi
          echo "Validated target: LenxiQ medical database."

      - name: Confirm medical bank access (read-only)
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/preflight.json" <<'JSON'
          {"query":"select count(*)::bigint as medical_question_count from public.questions","read_only":true}
          JSON
          status=$(curl --silent --show-error --output "$RUNNER_TEMP/preflight-response.json" --write-out '%{http_code}' --retry 2 --retry-delay 2 \
            --request POST \
            --url "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query/read-only" \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header "Content-Type: application/json" \
            --data-binary @"$RUNNER_TEMP/preflight.json")
          if [[ "$status" != "201" ]]; then
            echo "::error::Read-only access to the medical database failed (HTTP $status)."
            jq -r 'if type == "object" then (.message // .error // "Check scoped token permissions and target project.") else "Unexpected response" end' "$RUNNER_TEMP/preflight-response.json" | head -c 400
            exit 1
          fi
          echo "Read-only connection to the correct medical question bank verified."

      - name: Apply reversible question-bank corrections
        shell: bash
        run: |
          set -euo pipefail
          jq -n --rawfile sql "$SQL_FILE" '{query:$sql,read_only:false}' > "$RUNNER_TEMP/medical-repair.json"
          status=$(curl --silent --show-error --output "$RUNNER_TEMP/medical-result.json" --write-out '%{http_code}' \
            --request POST \
            --url "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header "Content-Type: application/json" \
            --data-binary @"$RUNNER_TEMP/medical-repair.json")
          if [[ "$status" != "201" ]]; then
            echo "::error::No successful database repair confirmation (HTTP $status)."
            jq -r 'if type == "object" then (.message // .error // "Database query rejected") else "Unexpected response" end' "$RUNNER_TEMP/medical-result.json" | head -c 600
            exit 1
          fi
          echo "Reversible medical content repair query completed on $PROJECT_REF."

      - name: Independently verify repair backups and outstanding MCQ issues
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/verify.json" <<'JSON'
          {"query":"select (select count(*) from lenxiq_internal.question_repair_history where batch_id='20261101_clinical_rendering_v1')::bigint as original_rows_preserved, (select count(*) from lenxiq_internal.question_review_queue)::bigint as mcq_items_for_review, (select count(*) from public.questions)::bigint as total_medical_questions","read_only":true}
          JSON
          status=$(curl --silent --show-error --output "$RUNNER_TEMP/verify-response.json" --write-out '%{http_code}' --retry 2 --retry-delay 2 \
            --request POST \
            --url "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query/read-only" \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header "Content-Type: application/json" \
            --data-binary @"$RUNNER_TEMP/verify.json")
          if [[ "$status" != "201" ]]; then
            echo "::error::Write request completed but independent readback was unavailable (HTTP $status)."
            exit 1
          fi
          echo "### LenxiQ medical content repair" >> "$GITHUB_STEP_SUMMARY"
          echo "- Project: $PROJECT_REF" >> "$GITHUB_STEP_SUMMARY"
          echo "- Original edited rows stored privately for rollback" >> "$GITHUB_STEP_SUMMARY"
          echo "- Exact-match clinical corrections only; MCQ answer keys unchanged" >> "$GITHUB_STEP_SUMMARY"
          echo "- Verification: $(jq -c '.' "$RUNNER_TEMP/verify-response.json" | head -c 800)" >> "$GITHUB_STEP_SUMMARY"
          echo "Database verification counts (no student content):"
          jq -c '.' "$RUNNER_TEMP/verify-response.json" | head -c 1000
          echo
          echo "Database readback verified."
