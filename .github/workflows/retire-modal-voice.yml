name: Retire old Live Class Modal app (one-time)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/retire-modal-voice.yml'

permissions:
  contents: read

jobs:
  stop-old-voice:
    name: Stop the retired voice app without touching forex
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - name: Validate old voice account access
        run: |
          test -n "$MODAL_TOKEN_ID" && test -n "$MODAL_TOKEN_SECRET" || {
            echo "::error::Missing OLD study hub Modal account secrets"
            exit 1
          }
      - name: Install Modal CLI
        run: python -m pip install 'modal>=1,<2'
      - name: Stop the old LenxiQ voice app and scheduled room poller
        run: modal app stop lenxiq-ai-voice --yes
      - name: Confirm the old voice app is no longer deployed
        run: |
          modal app info lenxiq-ai-voice --json > /tmp/voice-app-info.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/voice-app-info.json'))
          print("Retired voice app status:", data.get("state", data.get("status", "check dashboard")))
          if str(data.get("state", data.get("status", ""))).lower() in ("deployed", "running"):
              raise SystemExit("Voice app still running")
          PY
